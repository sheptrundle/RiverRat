name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: imresamu/postgis:18-3.6-alpine
        env:
          POSTGRES_USER: riverrat
          POSTGRES_PASSWORD: riverrat
          POSTGRES_DB: riverrat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riverrat"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: ecCodes (GRIB decoding; bundled with the Python package only on macOS)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libeccodes0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Migrations match models
        run: uv run alembic upgrade head && uv run alembic check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
