services:
  db:
    # Multi-arch PostGIS build (the official postgis/postgis image is amd64-only).
    image: imresamu/postgis:18-3.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-riverrat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riverrat}
      POSTGRES_DB: ${POSTGRES_DB:-riverrat}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-riverrat}:${POSTGRES_PASSWORD:-riverrat}@db:5432/${POSTGRES_DB:-riverrat}
      DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      # Each gauge's storm library and ratings (models/store.py), read-only.
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  worker:
    # Recurring jobs (riverrat.jobs.scheduler), e.g. archiving NOAA forecasts every 3 h.
    build: ./backend
    command: ["python", "-m", "riverrat.jobs.scheduler"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-riverrat}:${POSTGRES_PASSWORD:-riverrat}@db:5432/${POSTGRES_DB:-riverrat}
      DATA_DIR: /data
    volumes:
      - ./data:/data
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started  # the api container applies migrations

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:8000
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      # Keep the container's Linux node_modules separate from the host's.
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
